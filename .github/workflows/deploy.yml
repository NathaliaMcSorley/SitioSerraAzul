# Automatically build and deploy the application to GitHub Pages
name: Deploy to GitHub Pages

# Run deployment on pushes to main or manual execution
on:
  push:
    branches: [main]
  workflow_dispatch:

# Default workflow permissions
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # Download repository source code
      - uses: actions/checkout@v5
      # Prepare GitHub Pages configuration
      - uses: actions/configure-pages@v6
      # Install Node.js 24 and enable npm dependency caching
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Install dependencies using the lockfile
      - run: npm ci
      # Build the Next.js application for GitHub Pages
      # Base path is required because this is a GitHub project site
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /SitioSerraAzul
      # Package the generated static website (out/) for deployment
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Publish the generated website to GitHub Pages
  deploy:
    environment:
      name: github-pages
      # Expose the published website URL in the GitHub environment
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      # Deploy the uploaded artifact to GitHub Pages
      - id: deployment
        uses: actions/deploy-pages@v5
